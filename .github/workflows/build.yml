name: Build Cam.ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate app icon
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow
          .venv/bin/python scripts/make_icon.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cam.xcodeproj \
            -scheme Cam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          # (the app's own executable, not just the bundle folder: a failed compile can leave that)
          test -x build/Build/Products/Release-iphoneos/Cam.app/Cam

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cam.app Payload/
          zip -qry Cam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cam-ipa
          path: Cam.ipa

      - name: Publish IPA branch
        run: |
          mkdir -p /tmp/ipa_out
          cp Cam.ipa /tmp/ipa_out/
          cd /tmp/ipa_out
          git init -q -b ipa
          git config user.name "cam-ci"
          git config user.email "cam-ci@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}" > COMMIT.txt
          git add -A
          git commit -qm "Cam.ipa for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log

  test:
    runs-on: macos-15-intel
    timeout-minutes: 110
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow numpy

      - name: Make test data
        run: |
          mkdir -p /tmp/syn results
          .venv/bin/python harness/cards.py /tmp
          .venv/bin/python harness/gen_synthetic.py /tmp/syn 300
          .venv/bin/python harness/gen_synthetic.py /tmp/syn2 300 close
          .venv/bin/python harness/gen_synthetic.py /tmp/syn3 300 court
          .venv/bin/python harness/gen_synthetic.py /tmp/syn4 300 entries
          .venv/bin/python harness/gen_synthetic.py /tmp/syn5 300 closecourt
          .venv/bin/python harness/gen_synthetic.py /tmp/syn6 300 warm
          .venv/bin/python harness/gen_synthetic.py /tmp/syn7 330 light
          .venv/bin/python harness/gen_synthetic.py /tmp/syn8 300 tilt
          .venv/bin/python harness/gen_synthetic.py /tmp/syn9 345 rearm
          .venv/bin/python harness/render_face.py 9_hearts /tmp/fake_9h.png

      - name: Build harness
        run: |
          set -o pipefail
          swiftc -O -g -o /tmp/harness \
            Cam/Tuning.swift Cam/Geometry.swift Cam/PlanarTracker.swift Cam/InkFinder.swift Cam/CardTracker.swift Cam/Compositor.swift Cam/FramePipeline.swift Cam/Settings.swift \
            harness/Stubs.swift harness/main.swift 2>&1 | tee results/harness_build.log | grep -E "error" || true
          test -x /tmp/harness

      - name: Synthetic test
        continue-on-error: true
        run: |
          set -o pipefail
          if ! /tmp/harness synth /tmp/syn /tmp/fake_9h.png results/synth 0.75 2>&1 | tee results/synth_log.txt; then
            echo "harness crashed; backtrace:" | tee -a results/synth_log.txt
            lldb --batch -o run -k "bt 30" -k quit -- /tmp/harness synth /tmp/syn /tmp/fake_9h.png results/synth 0.75 2>&1 | tail -80 | tee -a results/synth_log.txt
          fi
          .venv/bin/python harness/trace_eval.py /tmp/syn/gt.json results/synth_trace.csv results/synth.json results/eval_synth.json main 2>&1 | tee results/eval_synth.txt || true

      - name: Close-up and angles test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn2 /tmp/fake_9h.png results/synth2 0.75 2>&1 | tee results/synth2_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn2/gt.json results/synth2_trace.csv results/synth2.json results/eval_synth2.json close 2>&1 | tee results/eval_synth2.txt || true

      - name: Court card on a wall test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn3 /tmp/fake_9h.png results/synth3 0.75 2>&1 | tee results/synth3_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn3/gt.json results/synth3_trace.csv results/synth3.json results/eval_synth3.json court 2>&1 | tee results/eval_synth3.txt || true

      - name: Coming into view test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn4 /tmp/fake_9h.png results/synth4 0.75 2>&1 | tee results/synth4_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn4/gt.json results/synth4_trace.csv results/synth4.json results/eval_synth4.json entries 2>&1 | tee results/eval_synth4.txt || true

      - name: Close-up court card test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn5 /tmp/fake_9h.png results/synth5 0.75 2>&1 | tee results/synth5_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn5/gt.json results/synth5_trace.csv results/synth5.json results/eval_synth5.json closecourt 2>&1 | tee results/eval_synth5.txt || true

      - name: Warm lamp test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn6 /tmp/fake_9h.png results/synth6 0.75 2>&1 | tee results/synth6_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn6/gt.json results/synth6_trace.csv results/synth6.json results/eval_synth6.json main 2>&1 | tee results/eval_synth6.txt || true

      - name: Changing light test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn7 /tmp/fake_9h.png results/synth7 0.75 2>&1 | tee results/synth7_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn7/gt.json results/synth7_trace.csv results/synth7.json results/eval_synth7.json light 2>&1 | tee results/eval_synth7.txt || true

      - name: Steep angles test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn8 /tmp/fake_9h.png results/synth8 0.75 2>&1 | tee results/synth8_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn8/gt.json results/synth8_trace.csv results/synth8.json results/eval_synth8.json tilt 2>&1 | tee results/eval_synth8.txt || true

      - name: Reveal and re-arm test
        continue-on-error: true
        run: |
          /tmp/harness synth /tmp/syn9 /tmp/fake_9h.png results/synth9 0.75 2>&1 | tee results/synth9_log.txt || true
          .venv/bin/python harness/trace_eval.py /tmp/syn9/gt.json results/synth9_trace.csv results/synth9.json results/eval_synth9.json rearm 2>&1 | tee results/eval_synth9.txt || true

      - name: Variants
        continue-on-error: true
        run: |
          # some of the same tests with other settings, to compare (name, settings, videos)
          run_variant() {
            for v in $3; do
              case "$v" in
                syn) dir=/tmp/syn; seg=main; p=v ;;
                syn2) dir=/tmp/syn2; seg=close; p=v2 ;;
                syn3) dir=/tmp/syn3; seg=court; p=v3 ;;
                syn4) dir=/tmp/syn4; seg=entries; p=v4 ;;
                syn5) dir=/tmp/syn5; seg=closecourt; p=v5 ;;
                syn6) dir=/tmp/syn6; seg=main; p=v6 ;;
                syn7) dir=/tmp/syn7; seg=light; p=v7 ;;
                syn8) dir=/tmp/syn8; seg=tilt; p=v8 ;;
                syn9) dir=/tmp/syn9; seg=rearm; p=v9 ;;
                *) continue ;;
              esac
              /tmp/harness synth "$dir" /tmp/fake_9h.png "results/${p}_$1" 0.75 "$2" > "results/${p}_$1_log.txt" 2>&1 || true
              .venv/bin/python harness/trace_eval.py "$dir/gt.json" "results/${p}_$1_trace.csv" "results/${p}_$1.json" "results/eval_${p}_$1.json" "$seg" > "results/eval_${p}_$1.txt" 2>&1 || true
            done
          }
          while read -r name settings videos; do
            [ -n "$name" ] && run_variant "$name" "$settings" "${videos//,/ }"
          done < harness/variants.txt

      - name: Real video tests
        run: |
          shopt -s nullglob
          # big videos are stored in ~2 MB parts; join them back up
          for first in testdata/*.part00; do
            name="${first%.part00}"
            cat "$name".part* > "$name"
            shasum "$name"
          done
          for f in testdata/*.mov testdata/*.MOV testdata/*.mp4; do
            n=$(basename "$f"); n="${n%.*}"
            /tmp/harness video "$f" /tmp/fake_9h.png "results/real_$n" 0.5 2>&1 | tee "results/real_${n}_log.txt" || true
            # (and without holding the picture for a card coming in, to compare)
            /tmp/harness video "$f" /tmp/fake_9h.png "results/real_${n}_nohold" 0.5 hold=0 > "results/real_${n}_nohold_log.txt" 2>&1 || true
            # (and with the tracker as it was before the shadow and steep-angle changes)
            /tmp/harness video "$f" /tmp/fake_9h.png "results/real_${n}_oldtrack" 0.5 even=0,shadowmatch=0,bandpast=0,tiltlearn=0 > "results/real_${n}_oldtrack_log.txt" 2>&1 || true
          done

      - name: Publish harness results early
        continue-on-error: true
        run: |
          rm -rf /tmp/results_early && cp -R results /tmp/results_early
          cd /tmp/results_early
          git init -q -b results
          git config user.name "cam-ci"
          git config user.email "cam-ci@users.noreply.github.com"
          echo "commit ${GITHUB_SHA} (harness only, simulator still running)" > COMMIT.txt
          git add -A
          git commit -qm "Harness results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:results-harness

      - name: Screenshot the camera screen in the simulator
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -x
          .venv/bin/python scripts/make_icon.py
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild -project Cam.xcodeproj -scheme Cam -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=simbuild/Build/Products/Debug-iphonesimulator/Cam.app
          test -d "$APP"
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          pro=[t for t in c if 'Pro' in t[1]['name'] and 'Max' not in t[1]['name']]
          print(sorted(pro or c, key=lambda t: t[0])[-1][1]['udid'])")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl privacy "$DEV" grant all "$BID" || true
          xcrun simctl launch "$DEV" "$BID" -demoFront
          sleep 8
          xcrun simctl io "$DEV" screenshot results/ui_front.png
          xcrun simctl terminate "$DEV" "$BID" || true
          xcrun simctl launch "$DEV" "$BID" -demoBack
          sleep 8
          xcrun simctl io "$DEV" screenshot results/ui_back.png
          xcrun simctl list devices | grep Booted > results/ui_device.txt || true

          # End to end: the whole app on iOS, fed frames from files instead of the camera (the
          # simulator has none). The app logs every frame and saves what the screen shows.
          xcrun simctl terminate "$DEV" "$BID" || true
          DATA=$(xcrun simctl get_app_container "$DEV" "$BID" data)
          mkdir -p "$DATA/Documents"
          cp testdata/real1.mov "$DATA/Documents/real1.mov" || true
          cp -R /tmp/syn "$DATA/Documents/syn"
          cp -R /tmp/syn2 "$DATA/Documents/syn2"
          cp -R /tmp/syn3 "$DATA/Documents/syn3"
          cp -R /tmp/syn4 "$DATA/Documents/syn4"
          run_e2e() {
            name=$1; stem=$2; shift 2
            xcrun simctl launch "$DEV" "$BID" -e2e "$name" "$@"
            for k in $(seq 1 140); do
              [ -f "$DATA/Documents/e2e_$stem/done.txt" ] && break
              sleep 3
            done
            xcrun simctl io "$DEV" screenshot "results/e2e_${stem}_screen.png" || true
            cp -R "$DATA/Documents/e2e_$stem" results/ || true
            xcrun simctl terminate "$DEV" "$BID" || true
          }
          run_e2e syn syn -e2ePress 180,240
          run_e2e syn2 syn2
          run_e2e syn3 syn3
          run_e2e real1.mov real1
          run_e2e syn4 syn4
          .venv/bin/python harness/e2e_eval.py results/e2e_syn/log.csv results/e2e_syn.json /tmp/syn/gt.json 180,240 results/synth.json || true
          .venv/bin/python harness/e2e_eval.py results/e2e_syn2/log.csv results/e2e_syn2.json /tmp/syn2/gt.json "" results/synth2.json || true
          .venv/bin/python harness/e2e_eval.py results/e2e_syn3/log.csv results/e2e_syn3.json /tmp/syn3/gt.json "" results/synth3.json || true
          .venv/bin/python harness/e2e_eval.py results/e2e_real1/log.csv results/e2e_real1.json - || true
          .venv/bin/python harness/e2e_eval.py results/e2e_syn4/log.csv results/e2e_syn4.json /tmp/syn4/gt.json "" results/synth4.json || true

      - name: Publish results branch
        if: always()
        run: |
          cp -R results /tmp/results_out
          cd /tmp/results_out
          git init -q -b results
          git config user.name "cam-ci"
          git config user.email "cam-ci@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}" > COMMIT.txt
          git add -A
          git commit -qm "Results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" results
