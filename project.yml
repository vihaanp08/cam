name: Cam
options:
  bundleIdPrefix: com.vihaanpol
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Cam:
    type: application
    platform: iOS
    sources:
      - path: Cam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vihaanpol.cam
        PRODUCT_NAME: Cam
        INFOPLIST_KEY_CFBundleDisplayName: Cam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Cam/Info.plist
      properties:
        CFBundleDisplayName: Cam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        CADisableMinimumFrameDurationOnPhone: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Cam uses the camera to take photos."
        NSMicrophoneUsageDescription: "Cam listens for a snap to take its shot."
        NSPhotoLibraryAddUsageDescription: "Cam saves your photos to your library."
        NSPhotoLibraryUsageDescription: "Cam shows your latest photo next to the shutter."
schemes:
  Cam:
    build:
      targets:
        Cam: all
